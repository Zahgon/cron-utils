name: test

on:
  release:
    types: [created]
  pull_request:
  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Log level'
        required: true
        default: 'warning'
      tags:
        description: 'test'

jobs:
  build:

    strategy:
      matrix:
        go: [ '1.25' ]

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go }}

    - name: vet
      run: go vet ./...

    - name: test
      run: go test ./...
